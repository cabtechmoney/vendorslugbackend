services:
  - type: web
    name: vendor-frontend
    runtime: node
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_PRODUCT_API_URL
        sync: false

  - type: web
    name: vendor-backend
    runtime: python
    rootDir: vendorslugbackend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://vendor-frontend.onrender.com"

  - type: web
    name: vendor-product-service
    runtime: go
    rootDir: go_fibre
    buildCommand: go mod download && go build -o app .
    startCommand: ./app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://vendor-frontend.onrender.com"
      - key: PORT
        value: "8081"
